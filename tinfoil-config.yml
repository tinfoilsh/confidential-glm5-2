cvm-version: 0.10.8
cpus: 32
memory: 524288
gpus: 8

models:
  - name: "glm-5-2"
    repo: "zai-org/GLM-5.2-FP8@a0b55e88465d1a06afece97bc8d6b366aff39089"
    mpk: "98d8b697173111b91b32a4daafc179bb5d8c5dbcd8fb8732f1f73ffcbc7a9b9f_755663769600_4e76874a-36d8-54fd-a07e-6fc22dd54b6b"

containers:
  - name: "glm-5-2"
    image: "ghcr.io/tinfoilsh/confidential-glm5-2@sha256:0ec14195574398d1642739e96adb768b7c7633855d5971ada614290d3eaf78b9" # v0.0.20
    runtime: nvidia
    gpus: all
    restart: always
    env:
      - PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      - RUNAI_STREAMER_MEMORY_LIMIT: "4294967296"
      - RUNAI_STREAMER_CONCURRENCY: "8"
      - VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
      - VLLM_ALLREDUCE_USE_FLASHINFER: "0"
      - FLASHINFER_NO_DOWNLOAD: "1"
      - NUMBA_CACHE_DIR: "/root/numba-cache"
    command:
      [
        "--model",
        "/tinfoil/mpk/mpk-98d8b697173111b91b32a4daafc179bb5d8c5dbcd8fb8732f1f73ffcbc7a9b9f",
        "--kv-cache-dtype",
        "fp8",
        "--tensor-parallel-size",
        "8",
        "--attention-backend",
        "FLASHMLA_SPARSE",
        "--tool-call-parser",
        "glm47",
        "--enable-auto-tool-choice",
        "--enable-prompt-tokens-details",
        "--reasoning-parser",
        "glm45",
        "--served-model-name",
        "glm-5-2",
        "--scheduling-policy",
        "priority",
        "--port",
        "8001",
        "--load-format",
        "runai_streamer",
        "--disable-custom-all-reduce",
        "--compilation-config",
        '{"pass_config":{"fuse_allreduce_rms":false}}',
        "--max-model-len",
        "393216",
        "--max-num-seqs",
        "32",
        "--speculative-config",
        '{"method":"mtp","num_speculative_tokens":5}',
      ]
    tmpfs:
      /tmp: size=512m,mode=1777,exec
      /root: size=20g,mode=0700,exec
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 120m

shim:
  upstream-port: 8001
  authenticated: true
  authenticated-endpoints:
    - /v1/chat/completions
    - /v1/responses
    - /tokenize
    - /metrics
  paths:
    - /v1/chat/completions
    - /v1/models
    - /v1/responses
    - /tokenize
    - /metrics
    - /health
